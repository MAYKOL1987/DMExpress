<body data-page="cart">
<div class="dm-store-topbar"><div class="container-fluid d-flex justify-content-between"><span><i class="fas fa-truck-fast"></i> Envíos a todo el Perú</span><span>Atención directa por WhatsApp</span></div></div>
<section class="dm-brand-strip" aria-label="Marcas destacadas">

    <ul id="brandCarousel" tabindex="0" aria-label="Logotipos de marcas" aria-roledescription="carrusel">
        <li><img src="./assets/images/marcas/adidas.svg" alt="adidas" loading="lazy" decoding="async"></li><li><img src="./assets/images/marcas/puma.svg" alt="Puma" loading="lazy" decoding="async"></li><li><img src="./assets/images/marcas/nike.svg" alt="Nike" loading="lazy" decoding="async"></li><li><img src="./assets/images/marcas/columbia.svg" alt="Columbia" loading="lazy" decoding="async"></li><li><img class="dm-brand-logo-small" src="./assets/images/marcas/terrex.svg" alt="Terrex" loading="lazy" decoding="async"></li><li><img class="dm-brand-logo-small" src="./assets/images/marcas/hoka.png" alt="HOKA" loading="lazy" decoding="async"></li><li><img src="./assets/images/marcas/salomon.svg" alt="Salomon" loading="lazy" decoding="async"></li><li><img class="dm-brand-logo-small" src="./assets/images/marcas/asics.svg" alt="ASICS" loading="lazy" decoding="async"></li><li><img src="./assets/images/marcas/thenorthface.png" alt="The North Face" loading="lazy" decoding="async"></li>
    </ul>
    <button class="dm-brand-arrow" type="button" data-brand-direction="1" aria-label="Ver más marcas" aria-controls="brandCarousel"><i class="fas fa-chevron-right" aria-hidden="true"></i></button>

<header class="dm-store-header">
    <div class="container-fluid dm-header-inner">
        <a class="dm-detail-brand" href="index.html#inicio" aria-label="DMExpress inicio"><img class="dm-brand-logo" src="./assets/images/dmexpress-logo.png" alt="DMExpress"></a>
        <button class="dm-menu-toggle" id="mobileMenuToggle" type="button" aria-expanded="false" aria-controls="storeNavigation" aria-label="Abrir menú"><i class="fas fa-bars" aria-hidden="true"></i></button>
        <nav class="dm-store-links" id="storeNavigation" aria-label="Navegación principal"><a href="index.html#inicio">Inicio</a><a href="index.html#productos">Productos</a><a href="index.html#contacto">Contacto</a></nav>
        <div class="dm-header-actions">
            <label class="dm-search"><i class="fas fa-search" aria-hidden="true"></i><input type="search" id="searchGlobal" placeholder="¿Qué estás buscando?" aria-label="Buscar productos" autocomplete="off"></label>

            <a class="dm-tracking-link" href="tracking.html" aria-label="Consultar seguimiento de pedido" title="Seguimiento"><i class="far fa-user" aria-hidden="true"></i><span>Seguimiento</span></a>
            <a class="dm-detail-cart" href="cart.html" aria-current="page" aria-label="Abrir carrito"><i class="fas fa-bag-shopping" aria-hidden="true"></i><span>Carrito</span><b data-cart-count>0</b></a>
